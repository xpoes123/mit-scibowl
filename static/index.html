<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIT SciBowl Trainer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#1a1b26; --bg2:#24283b; --bg3:#292e42; --fg:#c0caf5; --muted:#565f89;
  --blue:#7aa2f7; --purple:#bb9af7; --green:#9ece6a; --red:#f7768e;
  --yellow:#e0af68; --cyan:#7dcfff; --orange:#ff9e64;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--blue)}
header{display:flex;align-items:center;gap:1rem;padding:.8rem 1.2rem;
  background:var(--bg2);border-bottom:1px solid var(--bg3);flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0;font-weight:700}
header h1 .m{color:var(--purple)} header h1 .s{color:var(--blue)}
.tabs{display:flex;gap:.3rem;margin-left:auto}
.tab{padding:.4rem .9rem;border-radius:8px;cursor:pointer;background:transparent;
  border:1px solid transparent;color:var(--muted);font-weight:600;font-size:.9rem}
.tab.active{background:var(--bg3);color:var(--fg);border-color:var(--blue)}
main{max-width:820px;margin:0 auto;padding:1.2rem}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem;
  font-size:.85rem}
.bar .grp{display:flex;gap:.25rem;align-items:center;background:var(--bg2);
  padding:.3rem .5rem;border-radius:8px}
.chip{padding:.2rem .6rem;border-radius:6px;cursor:pointer;background:var(--bg3);
  color:var(--muted);border:1px solid transparent;user-select:none}
.chip.on{color:var(--bg);font-weight:700}
.chip.math.on{background:var(--purple)} .chip.chemistry.on{background:var(--cyan)}
.chip.biology.on{background:var(--green)} .chip.on{background:var(--blue)}
select,input[type=range]{background:var(--bg3);color:var(--fg);border:1px solid var(--muted);
  border-radius:6px;padding:.2rem}
.card{background:var(--bg2);border:1px solid var(--bg3);border-radius:14px;
  padding:1.4rem;min-height:220px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.meta{display:flex;gap:.5rem;align-items:center;font-size:.72rem;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted);margin-bottom:.8rem;flex-wrap:wrap}
.badge{padding:.15rem .5rem;border-radius:20px;background:var(--bg3);font-weight:700}
.badge.math{color:var(--purple)} .badge.chemistry{color:var(--cyan)}
.badge.biology{color:var(--green)}
.qtext{font-size:1.25rem;line-height:1.55}
.choices{margin:1rem 0 0;padding:0;list-style:none}
.choices li{padding:.5rem .8rem;margin:.35rem 0;background:var(--bg3);border-radius:8px}
.answer{margin-top:1rem;padding:1rem;border-left:3px solid var(--green);
  background:var(--bg3);border-radius:0 8px 8px 0;font-size:1.1rem}
.answer b{color:var(--green)}
.explain{margin-top:1rem;padding:1rem;border-left:3px solid var(--purple);
  background:var(--bg3);border-radius:0 8px 8px 0;line-height:1.6}
.explain b{color:var(--fg)}
.explain .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--purple);margin-bottom:.4rem}
.explain p{margin:.5rem 0} .explain p:first-of-type{margin-top:0}
.explain ul,.explain ol{margin:.5rem 0;padding-left:1.3rem} .explain li{margin:.3rem 0}
.row{display:flex;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
button.act{padding:.6rem 1.1rem;border-radius:10px;border:none;cursor:pointer;
  font-weight:700;font-size:.95rem;background:var(--bg3);color:var(--fg)}
button.act:hover{filter:brightness(1.15)}
button.primary{background:var(--blue);color:var(--bg)}
button.good{background:var(--green);color:var(--bg)}
button.bad{background:var(--red);color:var(--bg)}
button.ghost{background:transparent;border:1px solid var(--muted);color:var(--muted)}
button:disabled{opacity:.4;cursor:default}
.stats{font-size:.8rem;color:var(--muted);margin-top:1rem;text-align:center}
.buzz-stage{font-size:1.7rem;line-height:1.6;min-height:180px;font-weight:500}
.buzz-stage .w{display:none} .buzz-stage .w.shown{display:inline}
.buzz-stage .w.now{color:var(--yellow)}
.buzz-stage .ph{color:var(--muted);font-size:1rem;font-weight:400}
.buzzed{color:var(--orange);font-weight:800;letter-spacing:.03em}
.hint{color:var(--muted);font-size:.8rem}
kbd{background:var(--bg3);border:1px solid var(--muted);border-radius:4px;
  padding:.05rem .4rem;font-size:.8rem}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;
  color:var(--cyan);background:var(--bg3);padding:.2rem .7rem;border-radius:20px}
.timer.slow{color:var(--orange)}
textarea{width:100%;min-height:120px;background:var(--bg);color:var(--fg);
  border:1px solid var(--muted);border-radius:8px;padding:.7rem;font:15px/1.5 ui-monospace,monospace;resize:vertical}
input.ans{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--blue);
  border-radius:8px;padding:.6rem;font-size:1.05rem;margin-top:.6rem}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  margin:.9rem 0 .3rem}
.progress{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-bottom:1rem}
.progress>i{display:block;height:100%;background:var(--purple)}
table.res{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:1rem}
table.res td,table.res th{padding:.4rem .6rem;border-bottom:1px solid var(--bg3);text-align:left}
table.res .ok{color:var(--green)} table.res .no{color:var(--red)}
table.res .t-slow{color:var(--orange)}
.score{font-size:2rem;font-weight:800;color:var(--blue)}
.lesson-list{display:grid;gap:.7rem}
.lesson-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;padding:1rem 1.2rem;cursor:pointer;display:flex;gap:.9rem;align-items:flex-start}
.lesson-card:hover{border-color:var(--blue)}
.lesson-card .pri{font-size:.65rem;font-weight:800;padding:.2rem .5rem;border-radius:20px;background:var(--bg3);white-space:nowrap}
.lesson-card .pri.p1{color:var(--red)} .lesson-card .pri.p2{color:var(--yellow)} .lesson-card .pri.p3{color:var(--muted)}
.lesson-card h3{margin:0 0 .2rem;color:var(--blue)}
.lesson-card p{margin:0;color:var(--muted);font-size:.88rem}
.lcard{border-left:3px solid var(--bg3);background:var(--bg2);border-radius:0 10px 10px 0;padding:1.1rem 1.3rem;margin:1rem 0;line-height:1.62}
.lcard .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;margin-bottom:.4rem}
.lcard>b{display:block;margin-bottom:.5rem;font-size:1.05rem}
.lcard p{margin:.6rem 0}
.lcard ul,.lcard ol{margin:.5rem 0;padding-left:1.3rem}
.lcard li{margin:.4rem 0}
.lcard .katex-display{margin:.8rem 0;overflow-x:auto;overflow-y:hidden;padding:.15rem 0}
.lcard h3{margin:.7rem 0 .3rem;font-size:1rem}
.lesson-overview{line-height:1.62}
.lesson-overview p{margin:.6rem 0} .lesson-overview p:first-child{margin-top:0}
.lcard.concept{border-color:var(--blue)} .lcard.concept .k{color:var(--blue)}
.lcard.formula{border-color:var(--green);background:var(--bg3)} .lcard.formula .k{color:var(--green)}
.lcard.trigger{border-color:var(--cyan)} .lcard.trigger .k{color:var(--cyan)}
.lcard.example{border-color:var(--purple)} .lcard.example .k{color:var(--purple)}
.lcard.intuition{border-color:var(--yellow)} .lcard.intuition .k{color:var(--yellow)}
.lcard.pitfall{border-color:var(--red)} .lcard.pitfall .k{color:var(--red)}
.lesson-overview{background:var(--bg3);border-radius:10px;padding:.9rem 1.1rem;margin:.7rem 0 0;color:var(--fg)}
.solution{margin-top:.6rem;padding:.8rem 1rem;border-left:3px solid var(--purple);background:var(--bg3);border-radius:0 8px 8px 0}
.solution .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--purple);margin-bottom:.3rem}
.lcard b{color:var(--fg)}
.flip{background:var(--bg3);border-radius:8px;padding:.7rem .9rem;margin:.4rem 0;cursor:pointer}
.flip .t{color:var(--cyan);font-weight:600} .flip .a{color:var(--green);margin-top:.35rem;display:none}
.flip.on .a{display:block}
.sec-h{color:var(--purple);margin:1.6rem 0 .5rem;font-size:1.05rem}
.pq{background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;padding:1rem;margin:.7rem 0}
.pq .tgt{font-size:.72rem;color:var(--orange);font-weight:700;float:right}
.md h2{color:var(--blue);border-bottom:1px solid var(--bg3);padding-bottom:.3rem}
.md h3{color:var(--purple)} .md code{background:var(--bg3);padding:.1rem .3rem;border-radius:4px}
.md li{margin:.2rem 0}
.tbl{overflow-x:auto;margin:.6rem 0}
.lcard table,.md table{border-collapse:collapse;width:100%;font-size:.9rem}
.lcard th,.md th{text-align:left;color:var(--cyan);border-bottom:1px solid var(--muted);padding:.35rem .55rem;white-space:nowrap}
.lcard td,.md td{border-bottom:1px solid var(--bg3);padding:.35rem .55rem;vertical-align:top}
.katex{font-size:1.05em}
.empty{color:var(--muted);text-align:center;padding:3rem}
</style>
</head>
<body>
<header>
  <h1><span class="m">MIT</span> <span class="s">SciBowl</span> Trainer</h1>
  <div class="tabs">
    <button class="tab active" data-mode="learn">Learn</button>
    <button class="tab" data-mode="flash">Flashcards</button>
    <button class="tab" data-mode="buzz">Buzz Trainer</button>
    <button class="tab" data-mode="test">Placement Test</button>
    <button class="tab" data-mode="plan">Study Plan</button>
  </div>
</header>
<main>
  <div id="filters" class="bar"></div>
  <div id="view"></div>
</main>
<script>
const $=(s,e=document)=>e.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n};
function typeset(node){
  if(!node)return;
  if(window.renderMathInElement){
    try{renderMathInElement(node,{throwOnError:false,delimiters:[
      {left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},
      {left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}]});}catch(e){}
  }else{ setTimeout(()=>typeset(node),150); } // KaTeX loads via defer; retry until ready
}
const state={
  mode:'learn', all:[], deck:[], idx:0, revealed:false,
  lessons:null, lessonOpen:null,
  expCache:JSON.parse(localStorage.getItem('sb_exp')||'{}'),
  subjects:new Set(['Math','Chemistry','Biology']),
  qtype:'all', kind:'all', year:'all', noVisual:true,
  stats:JSON.parse(localStorage.getItem('sb_stats')||'{}'),
  wpm:180, tts:false,
  test:{set:[],idx:0,results:[],phase:'intro',startT:0,tick:null},
};
const saveStats=()=>localStorage.setItem('sb_stats',JSON.stringify(state.stats));

async function boot(){
  state.all=await (await fetch('questions.json')).json();
  state.byId={}; state.all.forEach(q=>state.byId[q.id]=q);
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));
  document.addEventListener('keydown',onKey);
  renderFilters(); rebuild(); render();
}
function setMode(m){
  state.mode=m; stopBuzz();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===m));
  renderFilters(); if(m==='flash'||m==='buzz'){rebuild();} render();
}

// ---------- filtering ----------
function rebuild(){
  let d=state.all.filter(q=>state.subjects.has(q.category));
  if(state.qtype!=='all') d=d.filter(q=>q.qtype===state.qtype);
  if(state.kind!=='all') d=d.filter(q=>q.kind===state.kind);
  if(state.year!=='all') d=d.filter(q=>q.year==state.year);
  if(state.noVisual) d=d.filter(q=>!q.visual);
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
  state.deck=d; state.idx=0; state.revealed=false;
}
function renderFilters(){
  const f=$('#filters'); f.innerHTML='';
  if(state.mode==='plan'||state.mode==='test'||state.mode==='learn') return;
  const subj=el('div','grp');
  ['Math','Chemistry','Biology'].forEach(s=>{
    const c=el('span','chip '+s.toLowerCase()+(state.subjects.has(s)?' on':''),s);
    c.onclick=()=>{state.subjects.has(s)?state.subjects.delete(s):state.subjects.add(s);
      if(!state.subjects.size)state.subjects.add(s);renderFilters();rebuild();render();};
    subj.append(c);
  });
  f.append(subj);
  const mk=(label,key,opts)=>{
    const g=el('div','grp'); g.append(el('span','',label));
    const sel=el('select');
    opts.forEach(([v,t])=>{const o=el('option',null,t);o.value=v;if(state[key]==v)o.selected=true;sel.append(o);});
    sel.onchange=()=>{state[key]=sel.value;rebuild();render();}; g.append(sel); return g;
  };
  f.append(mk('Type','qtype',[['all','All'],['sa','Short answer'],['mc','Multiple choice']]));
  f.append(mk('Set','kind',[['all','Toss-up + Bonus'],['tossup','Toss-up'],['bonus','Bonus']]));
  f.append(mk('Year','year',[['all','All years'],['2023','2023'],['2024','2024'],['2025','2025']]));
  const vg=el('div','grp');
  const vc=el('span','chip'+(state.noVisual?' on':''),'Hide image Qs');
  vc.onclick=()=>{state.noVisual=!state.noVisual;renderFilters();rebuild();render();};
  vg.append(vc); f.append(vg);
  if(state.mode==='buzz'){
    const bg=el('div','grp');
    bg.append(el('span','',`Speed ${state.wpm}wpm`));
    const r=el('input');r.type='range';r.min=60;r.max=400;r.step=10;r.value=state.wpm;
    r.oninput=()=>{state.wpm=+r.value;bg.firstChild.textContent=`Speed ${state.wpm}wpm`;};
    bg.append(r); f.append(bg);
    const tg=el('div','grp');
    const tc=el('span','chip'+(state.tts?' on':''),'🔊 Read aloud');
    tc.onclick=()=>{state.tts=!state.tts;renderFilters();};
    tg.append(tc); f.append(tg);
  }
}

// ---------- render dispatch ----------
function render(){
  if(state.mode==='learn') return renderLearn();
  if(state.mode==='plan') return renderPlan();
  if(state.mode==='test'){ renderTest(); return typeset($('#view')); }
  if(!state.deck.length){$('#view').innerHTML='<div class="empty">No questions match these filters.</div>';return;}
  state.mode==='flash'?renderFlash():renderBuzz();
  typeset($('#view'));
}
function curr(){return state.deck[state.idx];}
function metaEl(q){
  const cl=q.category.toLowerCase();
  return `<div class="meta">
    <span class="badge ${cl}">${q.category}</span>
    <span>${q.year} · R${q.round}</span>
    <span>${q.kind}</span>
    <span>${q.qtype==='mc'?'multiple choice':'short answer'}</span>
    ${q.visual?'<span style="color:var(--orange)">⚠ image</span>':''}
  </div>`;
}
function subjStat(){
  const key=[...state.subjects].sort().join('+');
  const s=state.stats[key]||{seen:0,right:0};
  return `Session deck: ${state.deck.length} · lifetime ${key}: ${s.right}/${s.seen} (${s.seen?Math.round(100*s.right/s.seen):0}%)`;
}
function record(right){
  const key=[...state.subjects].sort().join('+');
  const s=state.stats[key]||(state.stats[key]={seen:0,right:0});
  s.seen++; if(right)s.right++; saveStats();
}

// ---------- flashcards ----------
function renderFlash(){
  const q=curr(); const v=$('#view'); v.innerHTML='';
  const card=el('div','card');
  let html=metaEl(q)+`<div class="qtext">${q.question}</div>`;
  if(q.qtype==='mc'&&q.choices) html+='<ul class="choices">'+
    Object.entries(q.choices).map(([k,t])=>`<li><b>${k})</b> ${t}</li>`).join('')+'</ul>';
  card.innerHTML=html;
  if(state.revealed){
    card.append(el('div','answer',`<b>Answer:</b> ${q.answer}`));
    const exp=el('div','explain','');exp.id='exp';exp.style.display='none';card.append(exp);
    const row=el('div','row');
    row.append(mkBtn('✓ Got it','act good',()=>{record(true);next();}));
    row.append(mkBtn('✗ Missed','act bad',()=>{record(false);next();}));
    row.append(mkBtn('💡 Explain approach','act ghost',explain));
    card.append(row);
  }else{
    const row=el('div','row');
    row.append(mkBtn('Show answer','act primary',()=>{state.revealed=true;render();}));
    row.append(mkBtn('Skip','act ghost',next));
    card.append(row);
    card.append(el('div','hint','<kbd>space</kbd> reveal · <kbd>→</kbd> skip'));
  }
  v.append(card);
  v.append(el('div','stats',subjStat()));
}
function mkBtn(label,cls,fn){const b=el('button',cls,label);b.onclick=fn;return b;}
function next(){state.idx=(state.idx+1)%state.deck.length;state.revealed=false;
  if(state.idx===0)rebuild();render();}

function showExplanation(exp,text){
  exp.innerHTML='<div class="k">Fast approach</div>'+mdToHtml(text); typeset(exp);
}
async function explain(){
  const q=curr(); const exp=$('#exp'); if(!exp)return;
  exp.style.display='block';
  if(state.expCache[q.id]){ showExplanation(exp,state.expCache[q.id]); return; } // client cache -> instant
  exp.innerHTML='<b>Thinking…</b>';
  try{
    const r=await fetch('explain',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:q.id})});
    if(!r.ok){exp.innerHTML='<b>⚠</b> '+(await r.text());return;}
    const d=await r.json();
    state.expCache[q.id]=d.explanation;
    localStorage.setItem('sb_exp',JSON.stringify(state.expCache));
    showExplanation(exp,d.explanation);
  }catch(e){exp.innerHTML='<b>⚠</b> '+e.message;}
}

// ---------- buzz trainer ----------
let buzzTimer=null,buzzWords=[],buzzPos=0,buzzed=false;
function renderBuzz(){
  const q=curr(); const v=$('#view'); v.innerHTML='';
  const card=el('div','card');
  card.innerHTML=metaEl(q);
  const stage=el('div','buzz-stage');stage.id='stage';
  buzzWords=q.question.match(/\$[^$]+\$|\S+/g)||[]; // keep $...$ math as one token
  stage.innerHTML='<span class="ph">Press <b>Start</b> (or <kbd>enter</kbd>) — the question reads one word at a time. '
    +'Hit <b>Buzz</b> (<kbd>space</kbd>) the instant you know it.</span>'
    +buzzWords.map((w,i)=>`<span class="w" data-i="${i}">${w}</span>`).join(' ');
  card.append(stage);
  const row=el('div','row');
  row.append(mkBtn('▶ Start','act primary',startBuzz));
  row.append(mkBtn('🔔 BUZZ','act good',doBuzz));
  row.append(mkBtn('Next','act ghost',next));
  card.append(row);
  card.append(el('div','hint','<kbd>enter</kbd> start · <kbd>space</kbd> buzz · <kbd>→</kbd> next'));
  const ans=el('div','answer');ans.id='bans';ans.style.display='none';card.append(ans);
  v.append(card);
  v.append(el('div','stats',subjStat()));
  buzzPos=0;buzzed=false;
}
function startBuzz(){
  stopBuzz(); buzzPos=0;buzzed=false;
  const ph=$('#stage .ph'); if(ph)ph.style.display='none';
  const q=curr();
  if(state.tts&&window.speechSynthesis){
    const u=new SpeechSynthesisUtterance(q.question);
    u.rate=Math.max(.5,Math.min(2,state.wpm/150));
    u.onboundary=(e)=>{ if(e.name==='word'||e.charIndex!=null){ revealUpTo(charToWord(e.charIndex)); } };
    u.onend=()=>{revealUpTo(buzzWords.length-1);};
    window.speechSynthesis.speak(u);
  }else{
    const ms=60000/state.wpm;
    buzzTimer=setInterval(()=>{
      revealUpTo(buzzPos); buzzPos++;
      if(buzzPos>=buzzWords.length)stopBuzz();
    },ms);
  }
}
function charToWord(ci){ // map a char index in the question to a word index
  const q=curr().question; let count=0;
  for(let i=0;i<buzzWords.length;i++){count+=buzzWords[i].length+1;if(ci<count)return i;}
  return buzzWords.length-1;
}
function revealUpTo(i){
  const stage=$('#stage');if(!stage)return;
  stage.querySelectorAll('.w').forEach(w=>{
    const wi=+w.dataset.i;
    w.classList.toggle('shown',wi<=i);
    w.classList.toggle('now',wi===i);
  });
  buzzPos=Math.max(buzzPos,i+1);
}
function stopBuzz(){
  if(buzzTimer){clearInterval(buzzTimer);buzzTimer=null;}
  if(window.speechSynthesis)window.speechSynthesis.cancel();
}
function doBuzz(){
  if(buzzed)return; buzzed=true; stopBuzz();
  const q=curr(); const shown=buzzPos;
  const pct=Math.round(100*shown/buzzWords.length);
  const ans=$('#bans'); if(!ans)return;
  // reveal full question so you can self-check
  $('#stage').querySelectorAll('.w').forEach(w=>{w.classList.add('shown');w.classList.remove('now');});
  ans.style.display='block';
  ans.innerHTML=`<span class="buzzed">🔔 Buzzed at word ${shown}/${buzzWords.length} (${pct}% in)</span><br>
    <b>Answer:</b> ${q.answer}`;
}

// ---------- keyboard ----------
function onKey(e){
  if(state.mode==='flash'){
    if(e.code==='Space'){e.preventDefault(); state.revealed?null:(state.revealed=true,render());}
    else if(e.code==='ArrowRight'){e.preventDefault();next();}
  }else if(state.mode==='buzz'){
    if(e.code==='Space'){e.preventDefault();doBuzz();}
    else if(e.code==='Enter'){e.preventDefault();startBuzz();}
    else if(e.code==='ArrowRight'){e.preventDefault();next();}
  }
}

// ---------- placement test ----------
function renderTest(){
  const t=state.test, v=$('#view'); v.innerHTML='';
  if(t.phase==='intro') return testIntro(v);
  if(t.phase==='done') return testDone(v);
  const q=state.byId[t.set[t.idx].id], meta=t.set[t.idx];
  const card=el('div','card');
  const solved = t.phase!=='q' && t.draft;
  card.innerHTML=`<div class="progress"><i style="width:${100*t.idx/t.set.length}%"></i></div>`+
    `<div class="meta"><span>Question ${t.idx+1} / ${t.set.length}</span>`+
    `<span class="badge">${meta.topic}</span><span>${meta.difficulty}</span>`+
    `<span class="timer" id="timer">${solved?t.draft.seconds+'s ⏱':'0.0s'}</span></div>`+
    `<div class="qtext">${q.question}</div>`+
    (q.qtype==='mc'&&q.choices?'<ul class="choices">'+
      Object.entries(q.choices).map(([k,x])=>`<li><b>${k})</b> ${x}</li>`).join('')+'</ul>':'');
  if(t.phase==='q'){
    card.insertAdjacentHTML('beforeend',
      `<div class="lbl">Solve it, then submit — this stops the clock</div>
       <input class="ans" id="ans" placeholder="Final answer" autocomplete="off">`);
    const row=el('div','row');
    row.append(mkBtn('Submit answer ⏱','act primary',submitAnswer));
    card.append(row);
    v.append(card);
    const ans=$('#ans'); ans.focus();
    ans.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitAnswer();}});
    beginTimer();
  }else if(t.phase==='work'){
    card.insertAdjacentHTML('beforeend',
      `<div class="lbl">Your answer — locked in at ${t.draft.seconds}s</div>
       <div class="answer" style="border-color:var(--blue)">${t.draft.userAnswer||'<i>blank</i>'}</div>
       <div class="lbl">Now write up how you did it (untimed — this is for the gap analysis)</div>
       <textarea id="work" placeholder="Write out your steps, or note where you got stuck…"></textarea>`);
    const row=el('div','row');
    row.append(mkBtn('Continue','act primary',submitWork));
    card.append(row);
    v.append(card);
    $('#work').focus();
  }else{ // graded
    const d=t.draft;
    card.insertAdjacentHTML('beforeend',
      `<div class="lbl">Your answer (${d.seconds}s)</div>
       <div class="answer" style="border-color:var(--blue)">${d.userAnswer||'<i>blank</i>'}</div>
       <div class="answer"><b>Correct answer:</b> ${q.answer}</div>
       <div class="lbl">Did you get it right?</div>`);
    const row=el('div','row');
    row.append(mkBtn('✓ Correct','act good',()=>gradeQuestion(true)));
    row.append(mkBtn('✗ Wrong','act bad',()=>gradeQuestion(false)));
    card.append(row);
    v.append(card);
  }
}
function testIntro(v){
  const c=el('div','card');
  c.innerHTML=`<h2 style="margin-top:0;color:var(--blue)">Math Placement Test</h2>
    <p><b>24 questions</b> spanning every major math topic, curated to pinpoint your weak areas.
    For each one: <b>solve it while the clock runs</b> and submit your answer (that stops the timer, so it
    measures real solving speed), <b>then write up your work untimed</b>, then self-grade against the real answer.
    Speed counts in Science Bowl.</p>
    <p>At the end, your results (right/wrong, times, and your written work) go to Claude, which
    diagnoses your gaps — including mistakes visible in your steps — and writes a
    <b>personalized study plan</b>.</p>
    <p class="hint">Takes ~30–45 min. Your progress isn't saved mid-test, so do it in one sitting.</p>`;
  const row=el('div','row');
  row.append(mkBtn('Start full test (24 Q)','act primary',()=>startTest(false)));
  row.append(mkBtn('Quick 3-Q demo','act ghost',()=>startTest(true)));
  c.append(row); v.append(c);
}
async function startTest(demo){
  const t=state.test;
  if(!t.full){
    try{ t.full=await (await fetch('placement-math.json')).json(); }
    catch(e){ $('#view').innerHTML='<div class="empty">Placement test not available.</div>'; return; }
  }
  if(demo){
    const s=[...t.full]; for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]];}
    t.set=s.slice(0,3);
  } else { t.set=t.full; }
  t.idx=0; t.results=[]; t.phase='q'; render();
}
function beginTimer(){
  const t=state.test; t.startT=performance.now();
  if(t.tick)clearInterval(t.tick);
  t.tick=setInterval(()=>{
    const el2=$('#timer'); if(!el2){clearInterval(t.tick);return;}
    const s=(performance.now()-t.startT)/1000;
    el2.textContent=s.toFixed(1)+'s'; el2.classList.toggle('slow',s>20);
  },100);
}
function submitAnswer(){
  const t=state.test;
  const seconds=Math.round((performance.now()-t.startT)/10)/100;
  if(t.tick)clearInterval(t.tick);
  const meta=t.set[t.idx];
  t.draft={id:meta.id,topic:meta.topic,difficulty:meta.difficulty,
    userAnswer:$('#ans').value.trim(),work:'',seconds};
  t.phase='work'; render();
}
function submitWork(){
  const t=state.test;
  t.draft.work=$('#work').value.trim();
  t.phase='graded'; render();
}
function gradeQuestion(correct){
  const t=state.test;
  t.results.push({...t.draft,correct});
  t.idx++;
  if(t.idx>=t.set.length){ t.phase='done'; }
  else { t.phase='q'; }
  render();
}
function testDone(v){
  const t=state.test, r=t.results;
  const right=r.filter(x=>x.correct).length;
  const c=el('div','card');
  c.innerHTML=`<div class="score">${right} / ${r.length}</div>
    <p class="hint">Total time ${Math.round(r.reduce((a,x)=>a+x.seconds,0))}s ·
    avg ${(r.reduce((a,x)=>a+x.seconds,0)/r.length).toFixed(1)}s/question</p>`;
  let rows=r.map((x,i)=>`<tr><td>${i+1}</td><td>${x.topic}</td>
    <td class="${x.correct?'ok':'no'}">${x.correct?'✓':'✗'}</td>
    <td class="${x.seconds>20?'t-slow':''}">${x.seconds}s</td></tr>`).join('');
  c.insertAdjacentHTML('beforeend',
    `<table class="res"><tr><th>#</th><th>Topic</th><th></th><th>Time</th></tr>${rows}</table>`);
  const row=el('div','row');
  row.append(mkBtn('⬇ Download results (.txt)','act primary',downloadResults));
  row.append(mkBtn('🧠 Generate plan in-app','act ghost',generatePlan));
  row.append(mkBtn('Retake','act ghost',()=>{state.test.phase='intro';render();}));
  c.append(row);
  const out=el('div','md');out.id='planout';out.style.marginTop='1rem';c.append(out);
  v.append(c);
}
function downloadResults(){
  const r=state.test.results;
  const total=Math.round(r.reduce((a,x)=>a+x.seconds,0));
  const right=r.filter(x=>x.correct).length;
  const pad=s=>String(s).replace(/\n/g,'\n    ');
  let out=[];
  out.push('MIT SCIENCE BOWL — MATH PLACEMENT TEST RESULTS');
  out.push('Date: '+new Date().toString());
  out.push(`Score: ${right}/${r.length}  |  Total time: ${total}s  |  Avg: ${(total/r.length).toFixed(1)}s/question`);
  out.push('='.repeat(70));
  r.forEach((x,i)=>{
    const q=state.byId[x.id]||{};
    out.push('');
    out.push(`Q${i+1}  [${x.topic} · ${x.difficulty||'?'}]  id=${x.id}`);
    out.push(`Result: ${x.correct?'CORRECT':'WRONG'}   Time: ${x.seconds}s`);
    out.push(`Question: ${pad(q.question||'(missing)')}`);
    if(q.choices&&Object.keys(q.choices).length)
      out.push('Choices: '+Object.entries(q.choices).map(([k,y])=>`${k}) ${y}`).join('  '));
    out.push(`Correct answer: ${q.answer||'?'}`);
    out.push(`Your answer:    ${x.userAnswer||'(blank)'}`);
    out.push('Your work:');
    out.push('    '+pad(x.work||'(none written)'));
    out.push('-'.repeat(70));
  });
  const blob=new Blob([out.join('\n')],{type:'text/plain'});
  const d=new Date(), stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
  const a=el('a'); a.href=URL.createObjectURL(blob); a.download=`scibowl-placement-${stamp}.txt`;
  document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}
async function generatePlan(){
  const out=$('#planout'); out.innerHTML='<p class="hint">Analyzing your work and building a personalized plan…</p>';
  try{
    const res=await fetch('analyze-test',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({results:state.test.results})});
    if(!res.ok){out.innerHTML='<p class="hint">⚠ '+(await res.text())+'</p>';return;}
    const d=await res.json();
    out.innerHTML='<div class="card">'+mdToHtml(d.plan)+'</div>'; typeset(out);
    localStorage.setItem('sb_plan',d.plan);
  }catch(e){ out.innerHTML='<p class="hint">⚠ '+e.message+'</p>'; }
}

// ---------- learn ----------
async function renderLearn(){
  const v=$('#view');
  if(state.lessons===null){
    v.innerHTML='<div class="empty">Loading lessons…</div>';
    try{ state.lessons=await (await fetch('lessons.json')).json(); }
    catch(e){ state.lessons=[]; }
  }
  if(!state.lessons.length){ v.innerHTML='<div class="empty">Lessons are still being generated — check back shortly.</div>'; return; }
  if(state.lessonOpen) return renderLesson(v, state.lessonOpen);
  v.innerHTML='<p class="hint">Speed-focused Science Bowl lessons built from your placement test. Priority 1 = your highest-leverage gaps. Each ends with real questions to answer as you learn.</p>';
  const list=el('div','lesson-list');
  [...state.lessons].sort((a,b)=>a.priority-b.priority).forEach(L=>{
    const c=el('div','lesson-card');
    c.innerHTML=`<span class="pri p${L.priority}">P${L.priority}</span>
      <div><h3>${L.topic}</h3><p>${L.why}</p></div>`;
    c.onclick=()=>{state.lessonOpen=L.slug;render();};
    list.append(c);
  });
  v.append(list);
}
function renderLesson(v,slug){
  const L=state.lessons.find(x=>x.slug===slug); if(!L){state.lessonOpen=null;return renderLearn(v);}
  v.innerHTML='';
  const back=mkBtn('← All lessons','act ghost',()=>{state.lessonOpen=null;render();});
  v.append(back);
  const head=el('div','card');
  head.innerHTML=`<h2 style="margin:0 0 .3rem;color:var(--blue)">${L.topic}</h2><p class="hint" style="margin:0">${L.why}</p>`+
    (L.overview?`<div class="lesson-overview">${mdToHtml(L.overview)}</div>`:'');
  v.append(head);
  (L.cards||[]).forEach(card=>{
    const c=el('div','lcard '+card.kind);
    c.innerHTML=`<div class="k">${card.kind}</div><b>${card.title}</b><div>${mdToHtml(card.body)}</div>`;
    v.append(c);
  });
  if((L.memorize||[]).length){
    v.append(el('div','sec-h','⚡ Memorize cold — tap to check (drill to under 2 seconds)'));
    L.memorize.forEach(m=>{
      const f=el('div','flip',`<div class="t">${m.trigger}</div><div class="a">→ ${m.answer}</div>`);
      f.onclick=()=>f.classList.toggle('on');
      v.append(f);
    });
  }
  if((L.practice||[]).length){
    v.append(el('div','sec-h','📝 Practice — answer these as you learn'));
    L.practice.forEach(p=>{
      const q=state.byId[p.id]; if(!q)return;
      const tgt=q.kind==='tossup'?'tossup · aim &lt;5s':'bonus · aim &lt;20s';
      const c=el('div','pq');
      let html=`<span class="tgt">${tgt}</span><div class="qtext" style="font-size:1.05rem">${q.question}</div>`;
      if(q.qtype==='mc'&&q.choices) html+='<ul class="choices">'+
        Object.entries(q.choices).map(([k,x])=>`<li><b>${k})</b> ${x}</li>`).join('')+'</ul>';
      c.innerHTML=html;
      const rev=el('div','answer');rev.style.display='none';
      rev.innerHTML=`<b>Answer:</b> ${q.answer}`+(p.note?`<div class="hint" style="margin-top:.4rem">${p.note}</div>`:'');
      const sol=el('div','solution');sol.style.display='none';
      sol.innerHTML=`<div class="k">Fast solution</div>${mdToHtml(p.solution||'')}`;
      const row=el('div','row');
      row.append(mkBtn('Reveal answer','act primary',()=>{rev.style.display='block';}));
      if(p.solution) row.append(mkBtn('Show fast solution','act ghost',()=>{rev.style.display='block';sol.style.display='block';}));
      c.append(row); c.append(rev); c.append(sol);
      v.append(c);
    });
  }
  const b2=mkBtn('← All lessons','act ghost',()=>{state.lessonOpen=null;render();});
  const wrap=el('div','row');wrap.append(b2);v.append(wrap);
  typeset(v);
}

// ---------- study plan ----------
async function renderPlan(){
  const v=$('#view'); v.innerHTML='<div class="empty">Loading plan…</div>';
  const saved=localStorage.getItem('sb_plan');
  try{
    const md=await (await fetch('study-plan.md')).text();
    let html='';
    if(saved) html+='<div class="md card"><h2 style="margin-top:0">🧠 Your personalized plan (from your placement test)</h2>'+mdToHtml(saved)+'</div>';
    html+='<div class="md card"'+(saved?' style="margin-top:1rem"':'')+'>'+
      (saved?'<h2 style="margin-top:0">General high-leverage plan</h2>':'')+mdToHtml(md)+'</div>';
    v.innerHTML=html; typeset(v);
  }catch(e){ v.innerHTML=saved?'<div class="md card">'+mdToHtml(saved)+'</div>':'<div class="empty">Study plan not generated yet.</div>'; }
}
function mdToHtml(md){
  const lines=(md||'').split('\n'); let html='',inList=false;
  // escape only & and < (keeps LaTeX \, ^, _, {} intact for KaTeX). Bold/code/italic after.
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/`(.+?)`/g,'<code>$1</code>').replace(/(^|[^\\])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>');
  const closeList=()=>{ if(inList){html+='</ul>';inList=false;} };
  const isRow=l=>/^\s*\|.*\|\s*$/.test(l);
  const isSep=l=>/^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(l);
  const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  for(let i=0;i<lines.length;i++){
    let l=lines[i];
    if(isRow(l)&&i+1<lines.length&&isSep(lines[i+1])){
      closeList();
      const head=cells(l); i+=2; let body='';
      while(i<lines.length&&isRow(lines[i])){body+='<tr>'+cells(lines[i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';i++;}
      i--;
      html+='<div class="tbl"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>';
      continue;
    }
    if(/^### /.test(l)){closeList();html+='<h3>'+inline(l.slice(4))+'</h3>';}
    else if(/^## /.test(l)){closeList();html+='<h2>'+inline(l.slice(3))+'</h2>';}
    else if(/^# /.test(l)){closeList();html+='<h1>'+inline(l.slice(2))+'</h1>';}
    else if(/^\s*[-*] /.test(l)){if(!inList){html+='<ul>';inList=true;}html+='<li>'+inline(l.replace(/^\s*[-*] /,''))+'</li>';}
    else if(/^\s*\d+\. /.test(l)){if(!inList){html+='<ul>';inList=true;}html+='<li>'+inline(l.replace(/^\s*\d+\. /,''))+'</li>';}
    else if(l.trim()===''){closeList();}
    else{closeList();html+='<p>'+inline(l)+'</p>';}
  }
  closeList();
  return html;
}
